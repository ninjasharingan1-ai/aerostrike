[/Script/Engine.InputSettings]
bEnableMouseSmoothing=False
bEnableFOVScaling=True

; Default Enhanced Input Action Map (bound by UAeroStrikePlayerController via InputMappingContext):
; - IA_AimLook        : Mouse XY 2D Axis -> World-space Mouse Aim (P0 Stable) / FreeLook (when C held) / EO/IR Gimbal
; - IA_FirePrimary    : LeftMouseButton / SpaceBar -> Primary Weapon Trigger (Press/Hold/Release)
; - IA_CycleFireMode  : R -> Cycle weapon-supported fire modes (Single / Burst / Auto)
; - IA_SelectSlot1..4 : 1, 2, 3, 4 -> Select Pylon Hardpoint Slot 1..4
; - IA_ToggleLock     : L -> Toggle mouse capture lock
; - IA_FreeLook       : C -> Hold Free Look (freezes desired world-space aim direction)
; - IA_CycleCamera    : U -> Cycle Chase / EO/IR / Flyby / Orbit
; - IA_ReconMark      : T -> Designate target inside active EO/IR FOV cone
; - IA_TargetLock     : Tab -> Cycle target lock
; - IA_Flares         : F -> Deploy IR countermeasures
; - IA_KamikazeArm    : B -> Arm terminal dive warhead
; - IA_Throttle       : MouseWheel / W / S / LeftShift -> Throttle / WEP
; - IA_ManualFlight   : W, S, A, D, Q, E -> Manual flight override (hands off smoothly to Mouse Aim)
